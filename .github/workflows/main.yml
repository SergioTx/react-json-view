name: main

on:
  push:
    branches:
      - main

jobs:
  release:
    if: |
      !startsWith(github.event.head_commit.message, 'chore(release):') &&
      !startsWith(github.event.head_commit.message, 'docs:') &&
      !startsWith(github.event.head_commit.message, 'ci:')
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.15.0
          registry-url: https://registry.npmjs.org
      - name: Install npm CLI with staged publishing
        run: npm install --global npm@12.2.0
      - name: Setup PNPM
        uses: pnpm/action-setup@v6
      - name: Install
        run: pnpm install --dangerously-allow-all-builds
      - name: Test
        run: pnpm test
      - name: Type Check
        run: pnpm typecheck
      - name: Coverage
        uses: coverallsapp/github-action@main
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build
        run: pnpm build
      - name: Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          git config user.email "txitxo37@gmail.com"
          git config user.name "SergioTx"
          git pull origin main
          git fetch --tags origin
          version="$(node -p "require('./package.json').version")"
          latest_tag="$(git describe --tags --abbrev=0 --match 'v[0-9]*' || true)"
          if git show-ref --verify --quiet "refs/tags/v${version}"; then
            release_status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --header "Authorization: Bearer ${GH_TOKEN}" --header "Accept: application/vnd.github+json" "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/releases/tags/v${version}")"
            if [[ "${release_status}" == "404" ]]; then
              pnpm release:github
            elif [[ "${release_status}" == "200" ]]; then
              pnpm release
            else
              echo "Could not check GitHub release for v${version}: HTTP ${release_status}"
              exit 1
            fi
          elif [[ -n "${latest_tag}" && "v${version}" != "${latest_tag}" ]]; then
            pnpm release:tag
            pnpm run postrelease
          else
            pnpm release
          fi
