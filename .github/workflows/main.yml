name: main

on:
  push:
    branches:
      - main

jobs:
  deploy-demo:
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.15.0
      - name: Setup PNPM
        uses: pnpm/action-setup@v6
      - name: Install
        run: pnpm install --frozen-lockfile --dangerously-allow-all-builds
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Build Demo
        run: pnpm docs:build
      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs/dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  release:
    concurrency: release
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.15.0
          registry-url: https://registry.npmjs.org
      - name: Install npm CLI with staged publishing
        run: npm install --global npm@12.2.0
      - name: Setup PNPM
        uses: pnpm/action-setup@v6
      - name: Install
        run: pnpm install --dangerously-allow-all-builds
      - name: Test
        run: pnpm test
      - name: Type Check
        run: pnpm typecheck
      - name: Coverage
        uses: coverallsapp/github-action@main
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build
        run: pnpm build
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          git fetch --tags origin
          if git rev-parse --quiet --verify "refs/tags/v${version}" >/dev/null ||
            npm view "${name}@${version}" version >/dev/null 2>&1; then
            echo "Version ${version} already exists; nothing to publish."
            exit 0
          fi
          awk -v heading="## [${version}]" '
            index($0, heading) == 1 { found = 1; next }
            found && (/^## / || /^\[[^]]+\]: /) { exit }
            found { print }
          ' CHANGELOG.md > "${RUNNER_TEMP}/release-notes.md"
          if ! grep -q '[^[:space:]]' "${RUNNER_TEMP}/release-notes.md"; then
            echo "CHANGELOG.md has no notes for ${version}."
            exit 1
          fi
          git config user.email "txitxo37@gmail.com"
          git config user.name "SergioTx"
          pnpm release:tag
          npm stage publish --access=public
          git push origin "v${version}"
          gh release create "v${version}" --verify-tag --title "v${version}" --notes-file "${RUNNER_TEMP}/release-notes.md"
